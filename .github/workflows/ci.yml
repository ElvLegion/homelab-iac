---
name: Infrastructure CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/azure

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  ansible:
    name: Ansible and YAML
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            ansible-core==2.21.4 \
            ansible-lint==26.8.0 \
            yamllint==1.38.0

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run yamllint
        run: yamllint ansible/ .github/workflows/ci.yml

      - name: Run ansible-lint
        run: |
          ansible-lint --profile production \
            ansible/bootstrap.yml \
            ansible/maintenance.yml \
            ansible/monitoring.yml

      - name: Syntax check bootstrap playbook
        run: ansible-playbook -i ansible/inventory.yml ansible/bootstrap.yml --syntax-check

      - name: Syntax check maintenance playbook
        run: ansible-playbook -i ansible/inventory.yml ansible/maintenance.yml --syntax-check

      - name: Syntax check monitoring playbook
        run: ansible-playbook -i ansible/inventory.yml ansible/monitoring.yml --syntax-check

  checkov:
    name: Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov==3.3.19

      - name: Scan Terraform
        run: |
          checkov \
            -d terraform/azure \
            --framework terraform \
            --soft-fail-on CKV_AZURE_189,CKV_AZURE_109,CKV_AZURE_110,CKV_AZURE_42,CKV_AZURE_160,CKV_AZURE_50,CKV2_AZURE_32,CKV_AZURE_119
