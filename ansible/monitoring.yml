---
- name: Deploy homelab monitoring stack
  hosts: vm-hmlb-util
  become: true

  tasks:
    - name: Create monitoring directory
      ansible.builtin.file:
        path: /opt/monitoring/gatus
        state: directory
        owner: elvish
        group: elvish
        mode: "0755"

    - name: Create Caddy directory
      ansible.builtin.file:
        path: /opt/monitoring/caddy
        state: directory
        owner: elvish
        group: elvish
        mode: "0755"

    - name: Copy Docker Compose configuration
      ansible.builtin.copy:
        src: files/monitoring/compose.yml
        dest: /opt/monitoring/compose.yml
        owner: elvish
        group: elvish
        mode: "0644"

    - name: Copy Gatus configuration
      ansible.builtin.copy:
        src: files/monitoring/gatus/config.yaml
        dest: /opt/monitoring/gatus/config.yaml
        owner: elvish
        group: elvish
        mode: "0644"
      notify: Restart Gatus

    - name: Copy Caddy configuration
      ansible.builtin.copy:
        src: files/monitoring/caddy/Caddyfile
        dest: /opt/monitoring/caddy/Caddyfile
        owner: elvish
        group: elvish
        mode: "0644"
      notify:
        - Validate Caddy configuration
        - Reload Caddy

    - name: Start monitoring containers
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring
        state: present
        pull: always

    - name: Flush configuration handlers
      ansible.builtin.meta: flush_handlers

    - name: Verify Gatus health
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/health
        status_code: 200
        return_content: true
      register: gatus_health
      retries: 5
      delay: 3
      until: gatus_health.status == 200

    - name: Verify Grafana health
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/health
        status_code: 200
        return_content: true
      register: grafana_health
      retries: 5
      delay: 3
      until: grafana_health.status == 200

  handlers:
    - name: Restart Gatus
      ansible.builtin.command:
        cmd: docker compose -f /opt/monitoring/compose.yml restart gatus

    - name: Validate Caddy configuration
      ansible.builtin.command:
        cmd: docker exec caddy caddy validate --config /etc/caddy/Caddyfile
      changed_when: false

    - name: Reload Caddy
      ansible.builtin.command:
        cmd: docker exec caddy caddy reload --config /etc/caddy/Caddyfile
